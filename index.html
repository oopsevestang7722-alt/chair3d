<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>เก้าอี้สำนักงาน 3D – ลองวางในห้อง</title>
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>
  body { margin:0; font-family: system-ui, "Noto Sans Thai", sans-serif; background:#f4f1ec; color:#222; }
  main { max-width:900px; margin:0 auto; padding:16px; display:grid; gap:16px; }
  @media (min-width:760px){ main{ grid-template-columns:1.3fr 1fr; align-items:start; } }
  model-viewer { width:100%; height:420px; background:#fff; border-radius:16px; --poster-color:#fff; }
  .card { background:#fff; border-radius:16px; padding:20px; }
  h1 { font-size:1.4rem; margin:0 0 8px; }
  .price { font-size:1.5rem; font-weight:700; margin:8px 0 16px; }
  .colors { display:flex; gap:10px; margin:8px 0 16px; }
  .colors button { width:36px; height:36px; border-radius:50%; border:2px solid #ccc; cursor:pointer; }
  .colors button.on { border-color:#222; outline:2px solid #fff; outline-offset:-5px; }
  .size { margin:0 0 16px; padding-left:18px; }
  .btn { display:block; width:100%; padding:14px; border:0; border-radius:12px; font-size:1rem; cursor:pointer; margin-top:8px; }
  .ar { background:#222; color:#fff; }
  .buy { background:#e0533f; color:#fff; }
  #note { font-size:.85rem; color:#777; margin-top:12px; }
</style>
</head>
<body>
<main>
  <model-viewer id="chair" src="chairDesk.glb" alt="เก้าอี้สำนักงานแบบ 3D"
    camera-controls auto-rotate shadow-intensity="1" exposure="1"
    ar ar-modes="webxr scene-viewer quick-look" ar-scale="fixed">
  </model-viewer>

  <section class="card">
    <h1>เก้าอี้สำนักงาน รุ่น Desk</h1>
    <div class="price">฿1,990</div>

    <strong>เลือกสีที่นั่ง</strong>
    <div class="colors" id="colors">
      <button class="on" style="background:#d94038" data-c="0.85,0.25,0.22" title="แดง"></button>
      <button style="background:#2f6fd1" data-c="0.18,0.44,0.82" title="น้ำเงิน"></button>
      <button style="background:#2e9e6a" data-c="0.18,0.62,0.42" title="เขียว"></button>
      <button style="background:#2b2b2b" data-c="0.17,0.17,0.17" title="ดำ"></button>
    </div>

    <strong>ขนาดจริง</strong>
    <ul class="size">
      <li>กว้าง 52 ซม.</li>
      <li>ลึก 49 ซม.</li>
      <li>สูง 95 ซม.</li>
    </ul>

    <button class="btn ar" id="arBtn">ลองวางในห้องของคุณ (AR)</button>
    <button class="btn buy" onclick="alert('ตัวอย่าง: ใส่ตะกร้าแล้ว')">ใส่ตะกร้า</button>
    <div id="note"></div>
  </section>
</main>

<script>
  const mv = document.getElementById('chair');
  const note = document.getElementById('note');

  // เปลี่ยนสีที่นั่ง (วัสดุชื่อ "carpet")
  document.getElementById('colors').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    document.querySelectorAll('#colors button').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    const [r,g,bl] = b.dataset.c.split(',').map(Number);
    const m = mv.model.materials.find(m => m.name === 'carpet');
    if (m) m.pbrMetallicRoughness.setBaseColorFactor([r,g,bl,1]);
  });

  // ปุ่ม AR
  document.getElementById('arBtn').addEventListener('click', () => {
    if (mv.canActivateAR) mv.activateAR();
    else note.textContent = 'อุปกรณ์นี้ไม่รองรับ AR กรุณาเปิดเว็บนี้บนมือถือ (Safari บน iPhone / Chrome บน Android)';
  });
</script>
</body>
</html>
